# vgi-lint-check configuration for the vgi-statsmodels worker.
#
# Discovered by both the local `vgi-lint` CLI and the
# `Query-farm/vgi-lint-check@v1` CI action (which reads config from the
# working directory). No rule is waived or disabled here — this only sizes the
# execution *window* so the linter measures scan responsiveness instead of
# worker-spawn contention.

[execution]
# Why this worker needs a wider execution window (measured, not assumed).
#
# Every scan here is instant once the worker process is up: with probes run one
# at a time, the first table-function probe costs ~1.7s and every subsequent one
# ~0.01s. All of that 1.7s is a *cold worker spawn* — a fresh Python
# interpreter importing `vgi` plus the statsmodels/scipy/patsy stack
# (`import statsmodels.formula.api` alone is ~1-2s; see the module-level import
# note in `vgi_statsmodels/stats.py`). Nothing is fetched, nothing is unbounded,
# and no work is done inside the first batch: the fits themselves run in
# microseconds on the tiny example relations.
#
# The failure VGI911 was reporting is a thundering herd, not a slow scan. A
# bare-command LOCATION serves one query per worker process, so probing all
# seven relations at the default concurrency makes the vgi extension cold-start
# ~7 worker subprocesses simultaneously, each independently paying that
# statsmodels import. Measured on an 8-core machine: concurrency 1 -> slowest
# probe 1.7s; concurrency 2 -> 2.3s; concurrency 8 -> 4.6s. On a 2-core CI
# runner with a cold page cache the same herd crosses the 10s default and four
# of the six table functions time out.
#
# So: serialize the probes. This hides no finding — it measures each scan's real
# first-row latency against one warm worker instead of measuring how many Python
# interpreters the runner can boot at once — and it is also strictly faster
# end-to-end (1.8s wall vs 4.6s at concurrency 8).
concurrency = 1

# Headroom for the one unavoidable cold spawn above, on a slow/cold CI runner
# where the statsmodels import is paid against an unwarmed filesystem cache.
scan_timeout = 30.0
timeout = 60.0
slow_seconds = 30.0
